<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inquiries · Erik Reynolds Creative</title>
<link rel="icon" href="/images/favicon.png">
<style>
  :root{--paper:#f6f3ee;--paper2:#ece7df;--ink:#16181a;--ink2:#4a4d50;--accent:#b4694a;--accentd:#8f4f35;--line:rgba(22,24,26,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
  header img{height:44px}
  header .actions{display:flex;gap:10px;align-items:center}
  a.btn,button.btn{font:inherit;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
  a.btn:hover,button.btn:hover{border-color:var(--ink)}
  main{max-width:1100px;margin:0 auto;padding:22px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);padding:14px 16px}
  .stat b{display:block;font-size:1.8rem;font-weight:500}
  .stat span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{font:inherit;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list{display:grid;gap:10px}
  .item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line)}
  .item.architecture{border-left-color:var(--accent)}
  .item.new .who::after{content:"NEW";margin-left:10px;font-size:.65rem;letter-spacing:.14em;background:var(--accent);color:#fff;padding:2px 7px;vertical-align:middle}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;cursor:pointer}
  .who{font-weight:600;min-width:150px}
  .what{color:var(--ink2);flex:1;min-width:180px}
  .when{color:var(--ink2);font-size:.85rem}
  .tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;background:var(--paper2)}
  .tag.architecture{background:var(--accent);color:#fff}
  .detail{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
  .item.open .detail{display:block}
  dl{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:12px 0}
  dt{color:var(--ink2);font-size:.82rem}
  dd{margin:0;word-break:break-word}
  .msg{white-space:pre-wrap;background:var(--paper);border-left:3px solid var(--accent);padding:12px 14px;margin:10px 0}
  select,textarea{font:inherit;padding:8px;border:1px solid var(--line);background:#fff;max-width:100%}
  textarea{width:100%;min-height:70px}
  .controls{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}
  .empty{padding:40px;text-align:center;color:var(--ink2);background:#fff;border:1px dashed var(--line)}
  .saved{color:#2f6b3f;font-size:.82rem;margin-left:8px}
  @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img src="/images/logo-dark.png" alt="Erik Reynolds Creative">
  <div class="actions">
    <a class="btn" href="/" target="_blank" rel="noopener">View site</a>
    <a class="btn" href="/admin/export.csv">Export CSV</a>
    <form method="post" action="/admin/logout" style="margin:0"><button class="btn" type="submit">Sign out</button></form>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</main>

<script>
(function () {
  var data = [], statuses = [], filter = 'all', openId = null;
  var $ = function (id) { return document.getElementById(id); };
  var LABELS = { all: 'All', architecture: 'Architecture', photography: 'Photography', general: 'General', new: 'New' };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(s) { var d = new Date(String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? s : d.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }

  function load() {
    fetch('/api/admin/inquiries', { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { location.href = '/admin/login'; return null; }
      return r.json();
    }).then(function (j) { if (!j) return; data = j.inquiries; statuses = j.statuses; render(); })
      .catch(function () { $('list').replaceChildren(el('div', 'empty', 'Could not load inquiries. Refresh to try again.')); });
  }

  function render() {
    var count = function (f) { return data.filter(function (q) { return f === 'all' ? true : f === 'new' ? q.status === 'new' : q.category === f; }).length; };
    var st = $('stats'); st.replaceChildren();
    [['Total', count('all')], ['New', count('new')], ['Architecture', count('architecture')], ['Photography', count('photography')]].forEach(function (p) {
      var d = el('div', 'stat'); d.appendChild(el('b', null, p[1])); d.appendChild(el('span', null, p[0])); st.appendChild(d);
    });
    var tabs = $('tabs'); tabs.replaceChildren();
    ['all', 'new', 'architecture', 'photography', 'general'].forEach(function (f) {
      var b = el('button', 'tab' + (filter === f ? ' on' : ''), LABELS[f] + ' (' + count(f) + ')');
      b.onclick = function () { filter = f; render(); }; tabs.appendChild(b);
    });
    var list = $('list'); list.replaceChildren();
    var rows = data.filter(function (q) { return filter === 'all' ? true : filter === 'new' ? q.status === 'new' : q.category === filter; });
    if (!rows.length) { list.appendChild(el('div', 'empty', 'No inquiries here yet.')); return; }
    rows.forEach(function (q) { list.appendChild(item(q)); });
  }

  function item(q) {
    var wrap = el('div', 'item ' + q.category + (q.status === 'new' ? ' new' : '') + (openId === q.id ? ' open' : ''));
    var row = el('div', 'row');
    row.appendChild(el('span', 'who', q.name));
    row.appendChild(el('span', 'tag ' + q.category, q.category));
    row.appendChild(el('span', 'what', q.topic || (q.message || '').slice(0, 80)));
    row.appendChild(el('span', 'when', fmt(q.created_at)));
    row.onclick = function () { openId = openId === q.id ? null : q.id; render(); };
    wrap.appendChild(row);

    var d = el('div', 'detail'), dl = el('dl');
    [['Email', q.email], ['Phone', q.phone], ['Project type', q.project_type], ['Location', q.location], ['Timeline', q.timeline], ['Budget', q.budget], ['Status', q.status]].forEach(function (p) {
      if (!p[1]) return; dl.appendChild(el('dt', null, p[0]));
      var dd = el('dd');
      if (p[0] === 'Email') { var a = el('a', null, p[1]); a.href = 'mailto:' + p[1]; dd.appendChild(a); }
      else if (p[0] === 'Phone') { var t = el('a', null, p[1]); t.href = 'tel:' + p[1].replace(/[^\d+]/g, ''); dd.appendChild(t); }
      else dd.textContent = p[1];
      dl.appendChild(dd);
    });
    d.appendChild(dl);
    if (q.message) d.appendChild(el('div', 'msg', q.message));

    var ctl = el('div', 'controls'), sel = el('select');
    statuses.forEach(function (s) { var o = el('option', null, s); o.value = s; if (s === q.status) o.selected = true; sel.appendChild(o); });
    var saved = el('span', 'saved');
    sel.onchange = function () { patch(q, { status: sel.value }, saved); };
    var notes = el('textarea'); notes.placeholder = 'Private notes'; notes.value = q.notes || '';
    notes.onblur = function () { if (notes.value !== q.notes) patch(q, { notes: notes.value }, saved); };
    ctl.appendChild(sel); ctl.appendChild(notes); ctl.appendChild(saved);
    d.appendChild(ctl);
    wrap.appendChild(d);
    return wrap;
  }

  function patch(q, body, badge) {
    fetch('/api/admin/inquiries/' + q.id, { method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw 0; Object.assign(q, body); badge.textContent = 'Saved'; setTimeout(render, 600); })
      .catch(function () { badge.textContent = 'Could not save'; });
  }

  load();
})();
</script>
</body>
</html>
