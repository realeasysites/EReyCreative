<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Erik Reynolds Creative</title>
<link rel="icon" href="/images/favicon.png">
<style>
  :root{--paper:#f6f3ee;--ink:#16181a;--accent:#b4694a;--line:rgba(22,24,26,.16)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);padding:34px 30px}
  img{display:block;height:64px;margin:0 auto 18px}
  h1{font-size:1.1rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin:0 0 20px}
  label{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;margin:14px 0 6px;color:#4a4d50}
  input{width:100%;padding:12px;border:1px solid var(--line);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:22px;padding:14px;background:var(--accent);color:#fff;border:0;font:inherit;letter-spacing:.16em;text-transform:uppercase;font-size:.8rem;cursor:pointer}
  button:hover{background:#8f4f35}
  .msg{color:#8f4f35;font-size:.92rem;margin:0 0 6px;text-align:center}
</style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <img src="/images/logo-dark.png" alt="Erik Reynolds Creative">
    <h1>Inquiry dashboard</h1>
    <p class="msg">{{MESSAGE}}</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
